{% extends "base.html" %}
{% block title %}Company Profile{% endblock %}
{% block content %}
<h2>Company Profile</h2>
<div class="alert {% if company.is_verified_by_admin %}alert-success{% else %}alert-warning{% endif %}">
Verification: {% if company.is_verified_by_admin %}Verified{% else %}Pending admin verification{% endif %}
</div>
<form method="post" class="card card-body shadow-sm">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save Profile</button></form>
{% endblock %}
